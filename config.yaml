# Cardboard Face Mask — build configuration.
# Units are Skyrim world units (1 unit = 1.42875 cm; a human head is ~13 units wide).

# --- Photo / silhouette -------------------------------------------------------
source_image: input/IMG_2117.PNG
silhouette_mode: face_hair_glasses   # face_only | face_hair | face_hair_glasses

# --- Mask geometry ------------------------------------------------------------
thickness_units: 0.3        # cardboard thickness (~4 mm, deliberately chunky)
forward_offset_units: 1.8   # gap between the face surface (nose tip) and the back of the mask
bend_radius_units: 24       # cylindrical bend of the sheet around the face; 0 = perfectly flat
size_factor: 1.08           # photo chin-to-crown height relative to the NPC's chin-to-crown height
scale_human: 1.0
scale_female: 0.96          # applied on top of scale_human for the female model
scale_beast: 1.25           # Khajiit / Argonian (bigger heads, snouts)
edge_wobble_units: 0.04     # hand-cut jitter along the outline; 0 = clean die-cut
string_radius_units: 0.06
string_sag: 0.6             # 0..1, how far the string droops at the back of the head
string_asymmetry: 0.35      # 0..1, how lopsided the string is (one side rides higher)
string_clearance_units: 1.0 # how far the string rides above the bald scalp at the sides and over the
                            # ears (the back gets x (1 + string_back_swell)); 0.15 (minimum) = tight
                            # to the skull, hidden under hair; at most 2.5
string_back_swell: 0.75     # human: toward the back centre the clearance swells to
                            # string_clearance_units x (1 + this), where hair hangs thickest;
                            # 0 = level ring, 1.5 rides over thick dreads/manes (stiff hoop off a
                            # bald head); 0..2 accepted
tape_strip: true            # masking-tape strips holding the string on the back

# --- Plugin / distribution ----------------------------------------------------
plugin_name: CardboardFaceMask.esp
slot: 55                    # biped slot; 55 coexists with helmets (30/31/42)
non_playable: false         # true = hidden from inventory/loot (verify auto-equip in game first)
exclude_children: true
distribute_to_player: false # SPID only targets NPCs; use the console to try it on yourself
chance_percent: 100
equip_method: kef           # kef = also distribute a KEFEquip keyword so Keyword Equip Framework (SKSE)
                            #       makes NPCs wear the mask; engine = SPID Item line only (SPID never
                            #       equips items itself, so NPCs may just carry the mask in inventory)

# --- Textures -----------------------------------------------------------------
texture_size: 2048          # mask atlas edge length (power of two)
twine_texture_size: 512
